<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="wifi-sentry logo">
  <title>wifi-sentry</title>

  <defs>
    <linearGradient id="ws-good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#1A7F3C"/>
    </linearGradient>
    <linearGradient id="ws-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB950" stop-opacity=".85"/>
      <stop offset="1" stop-color="#1A7F3C" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="ws-sweep" cx="128" cy="176" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FB950" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sentry frame: a hex post, not a generic shield -->
  <path d="M128 12 L224 65 V191 L128 244 L32 191 V65 Z"
        fill="none" stroke="url(#ws-frame)" stroke-width="8" stroke-linejoin="round"/>

  <!-- radar wash behind the signal -->
  <path d="M128 12 L224 65 V191 L128 244 L32 191 V65 Z" fill="url(#ws-sweep)"/>

  <!-- legitimate signal: inner + outer arc -->
  <path d="M104 152 A34 34 0 0 1 152 152"
        fill="none" stroke="url(#ws-good)" stroke-width="15" stroke-linecap="round"/>
  <path d="M61 110 A94 94 0 0 1 195 110"
        fill="none" stroke="url(#ws-good)" stroke-width="15" stroke-linecap="round"/>

  <!-- the twin: same SSID, wrong radio. dashed + offset = the anomaly -->
  <path d="M83 131 A64 64 0 0 1 173 131"
        fill="none" stroke="#F85149" stroke-width="15" stroke-linecap="round"
        stroke-dasharray="26 20"/>

  <!-- the access point -->
  <circle cx="128" cy="176" r="13" fill="url(#ws-good)"/>
</svg>
